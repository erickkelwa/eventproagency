name: eventproagency
description: "EventPro — Premium Event Management Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # ── Core UI ──────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

  # ── State Management ─────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.20.5

  # ── Navigation ───────────────────────────────────────────
  go_router: ^14.6.2

  # ── Networking ───────────────────────────────────────────
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # ── Firebase ─────────────────────────────────────────────
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.2
  cloud_firestore: ^5.5.0
  firebase_messaging: ^15.1.4
  firebase_storage: ^12.3.5
  google_sign_in: ^6.2.2

  # ── Local Auth & Storage ─────────────────────────────────
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # ── Charts ───────────────────────────────────────────────
  fl_chart: ^0.69.0

  # ── QR Scanner ───────────────────────────────────────────
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # ── Image Picker ─────────────────────────────────────────
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # ── PDF & Excel Export ───────────────────────────────────
  pdf: ^3.11.1
  printing: ^5.13.2
  excel: ^4.0.6

  # ── Utilities ────────────────────────────────────────────
  url_launcher: ^6.3.1
  intl: ^0.19.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  equatable: ^2.0.7
  dartz: ^0.10.1

  # ── Animations ───────────────────────────────────────────
  animated_text_kit: ^4.2.3
  page_transition: ^2.1.0

  # ── Form & Validation ────────────────────────────────────
  form_validator: ^2.1.1
  pin_code_fields: ^8.0.1

  # ── Maps ─────────────────────────────────────────────────
  google_maps_flutter: ^2.12.0

  # ── Permissions ──────────────────────────────────────────
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#070D1A"
    theme_color: "#C89B3C"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#070D1A"
