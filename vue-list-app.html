<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue Fruit List</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link href="https://fonts.googleapis.css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #0f172a; 
      color: #f8fafc; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      margin: 0; 
    }
    .container { 
      background: #1e293b; 
      padding: 2rem; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
      width: 320px; 
    }
    h1 { 
      margin-top: 0; 
      font-size: 1.75rem; 
      color: #34d399; 
      text-align: center;
    }
    ul { 
      list-style-type: none; 
      padding: 0; 
    }
    li { 
      background: #334155; 
      margin: 0.5rem 0; 
      padding: 1rem; 
      border-radius: 8px; 
      transition: transform 0.2s ease, background 0.2s ease; 
      cursor: pointer;
      display: flex;
      align-items: center;
    }
    li:hover { 
      transform: translateX(8px); 
      background: #475569; 
    }
    button { 
      background: #34d399; 
      color: #0f172a; 
      border: none; 
      padding: 0.75rem 1rem; 
      border-radius: 8px; 
      cursor: pointer; 
      font-weight: 600; 
      font-size: 1rem;
      width: 100%; 
      margin-top: 1.5rem; 
      transition: background 0.2s ease, transform 0.1s ease; 
    }
    button:hover { 
      background: #10b981; 
    }
    button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div id="app" class="container">
    <h1>Fruit List</h1>
    <ul>
      <li v-for="(fruit, index) in fruits" :key="index">
        🍎 {{ fruit }}
      </li>
    </ul>
    <button @click="addFruit">Add Random Fruit</button>
  </div>

  <script>
    const { createApp, ref } = Vue;

    createApp({
      setup() {
        // 1. Create an array of fruits
        const fruits = ref(['Apple', 'Banana', 'Mango', 'Orange']);
        
        const extraFruits = ['Pineapple', 'Grapes', 'Strawberry', 'Kiwi', 'Watermelon', 'Peach', 'Cherry'];

        // Function to demonstrate reactivity
        const addFruit = () => {
          const randomFruit = extraFruits[Math.floor(Math.random() * extraFruits.length)];
          fruits.value.push(randomFruit);
        };

        return {
          fruits,
          addFruit
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
